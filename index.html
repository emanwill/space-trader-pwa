<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0e1a" />
    <meta
      name="description"
      content="Trade goods, upgrade your ship and battle pirates across the galaxy."
    />
    <link rel="icon" type="image/png" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Space Trader" />
    <title>Space Trader</title>
    <script>
      // The theme, before the first paint (see src/ui/theme.svelte.ts).
      (function () {
        var choice = 'system';
        try {
          choice = localStorage.getItem('space-trader-theme') || 'system';
        } catch (e) {}
        var light =
          choice === 'light' ||
          (choice === 'system' && matchMedia('(prefers-color-scheme: light)').matches);
        document.documentElement.dataset.theme = light ? 'light' : 'dark';
        if (light)
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f3f4f9');
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
